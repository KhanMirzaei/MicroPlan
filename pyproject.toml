[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "microplan"
version = "0.1.0"
description = "Reproducible microbiome sample allocation and study-design checks"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Mohammadali Khan Mirzaei"}]
dependencies = []

[project.scripts]
microplan = "microplan.cli:main"

[tool.setuptools.packages.find]
include = ["microplan*"]
